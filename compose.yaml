services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: environment
      POSTGRES_USER: warehouse_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_owner -d environment"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  warehouse_data:
