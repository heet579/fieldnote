name: Warehouse checks
on: [push, pull_request]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.demo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check_report.cjs portfolio/synthetic-dashboard.html
      - run: python -m scripts.package
      - run: python -m scripts.build_site
